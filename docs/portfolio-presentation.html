        font-weight: 800;

          height: 100vh;

          border-radius: 0;

        }

    </style>

              links: [["Mahalliy ishga tushirish", "../README.md"], ["Texnik vazifa", "../ReguGuard%20AI%20%E2%80%94%20Texnik%20vazifa%20(TZ)%20v1.0.md"]]

      const deck = document.querySelector("#deck");
      const counter = document.querySelector("#slide-counter");
      const progress = document.querySelector("#progress");
      const languageButtons = [...document.querySelectorAll("[data-language]")];
      let language = "en";
      let current = 0;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[character]);
      }

      function renderCard([title, body]) {
        return `<article class="card"><h3>${escapeHtml(title)}</h3><p>${escapeHtml(body)}</p></article>`;
      }

      function renderSlide(slide, index) {
        const content = [
          `<p class="eyebrow">${escapeHtml(slide.eyebrow)}</p>`,
          `<h${index === 0 ? 1 : 2}>${escapeHtml(slide.title)}</h${index === 0 ? 1 : 2}>`,
        ];
        if (slide.lead) content.push(`<p class="lead">${escapeHtml(slide.lead)}</p>`);
        if (slide.tags) content.push(`<div class="tag-row">${slide.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>`);
        if (slide.cards) content.push(`<div class="grid${slide.cards.length === 3 ? " three" : ""}">${slide.cards.map(renderCard).join("")}</div>`);
        if (slide.flow) content.push(`<div class="flow">${slide.flow.map(renderCard).join("")}</div>`);
        if (slide.architecture) content.push(`<div class="architecture">${slide.architecture.map(([title, body], itemIndex) => `${itemIndex ? '<span class="arrow" aria-hidden="true">→</span>' : ""}<div class="arch-box"><strong>${escapeHtml(title)}</strong><span>${body}</span></div>`).join("")}</div>`);
        if (slide.bullets) content.push(`<ul>${slide.bullets.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`);
        if (slide.callout) content.push(`<p class="callout">${escapeHtml(slide.callout)}</p>`);
        if (slide.closing) content.push(`<p class="lead" style="margin-top:24px">${escapeHtml(slide.closing)}</p>`);
        if (slide.links) content.push(`<div class="closing-links">${slide.links.map(([label, href]) => `<a href="${escapeHtml(href)}">${escapeHtml(label)} ↗</a>`).join("")}</div>`);
        if (slide.note) content.push(`<p class="small" style="margin:22px 0 0">${escapeHtml(slide.note)}</p>`);
        return `<section class="slide${index === current ? " active" : ""}" aria-label="${index + 1}">${content.join("")}</section>`;
      }

      function update() {
        const copy = translations[language];
        document.documentElement.lang = language;
        document.title = `ReguGuard — ${copy.header}`;
        document.querySelector("#header-label").textContent = copy.header;
        document.querySelector("#previous").setAttribute("aria-label", copy.previous);
        document.querySelector("#next").setAttribute("aria-label", copy.next);
        document.querySelector("#print").textContent = copy.print;
        languageButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.language === language)));
        deck.innerHTML = copy.slides.map(renderSlide).join("");
        const number = String(current + 1).padStart(2, "0");
        counter.textContent = `${number} / ${String(copy.slides.length).padStart(2, "0")}`;
        progress.style.width = `${((current + 1) / copy.slides.length) * 100}%`;
      }

      function navigate(delta) {
        current = Math.max(0, Math.min(translations[language].slides.length - 1, current + delta));
        update();
      }

      languageButtons.forEach((button) => button.addEventListener("click", () => {
        language = button.dataset.language;
        update();
      }));
      document.querySelector("#previous").addEventListener("click", () => navigate(-1));
      document.querySelector("#next").addEventListener("click", () => navigate(1));
      document.querySelector("#print").addEventListener("click", () => window.print());
      document.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") {
          event.preventDefault();
          navigate(1);
        } else if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          navigate(-1);
        } else if (event.key === "Home") {
          current = 0;
          update();
        } else if (event.key === "End") {
          current = translations[language].slides.length - 1;
          update();
        }
      });
      update();
    </script>
  </body>
